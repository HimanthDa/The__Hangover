{% extends 'base.html' %}

{% block title %}Sign Up{% endblock %}

{% block content %}
<div class="auth-card">
  <h1>Create Account</h1>
  <form method="post" action="{% url 'accounts:signup' %}">
    {% csrf_token %}
    <div class="form-group">
      <label for="id_username">Username</label>
      <input type="text" name="username" id="id_username" value="{{ username|default:'' }}" placeholder="Choose a username" required maxlength="150" autofocus>
    </div>
    <div class="form-group">
      <label for="id_email">Email Address</label>
      <input type="email" name="email" id="id_email" value="{{ email|default:'' }}" placeholder="name@example.com">
    </div>
    <div class="form-group">
      <label for="id_password1">Password</label>
      <input type="password" name="password1" id="id_password1" placeholder="Enter password (min 6 chars)" required>
    </div>
    <div class="form-group">
      <label for="id_password2">Confirm Password</label>
      <input type="password" name="password2" id="id_password2" placeholder="Re-enter password" required>
    </div>
    <button type="submit" class="btn btn-primary">Sign Up</button>
  </form>
  <p>Already have an account? <a href="{% url 'accounts:login' %}">Log in</a>.</p>
</div>
{% endblock %}
